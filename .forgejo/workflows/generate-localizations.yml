name: Generate Flutter Localizations

on:
  push:
    branches:
      - main
    paths:
      - lib/l10n/app_*.arb

  workflow_dispatch:

jobs:
  generate-localizations:
    name: Generate and Commit Localizations

    runs-on: epinez-private

    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04

    env:
      # Required for Flutter artifact extraction in rootless Podman containers.
      TAR_OPTIONS: "--no-same-owner"

    steps:
      - name: Checkout repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ forgejo.token }}

      - name: Setup Flutter
        uses: ./.forgejo/actions/setup-flutter

      - name: Generate localizations
        shell: bash
        run: |
          set -euo pipefail

          submodules/flutter/bin/flutter gen-l10n

      - name: Update Android locales config
        shell: bash
        run: |
          set -euo pipefail

          python ./scripts/update_locales_config/update_locales_config.py

      - name: Commit updated locales_config.xml
        shell: bash
        run: |
          set -euo pipefail

          locale_config="android/app/src/main/res/xml/locales_config.xml"

          if git diff --quiet -- "$locale_config"; then
            echo "Android locale configuration is already up to date."
            exit 0
          fi

          git add "$locale_config"

          git config user.name "forgejo-actions[bot]"
          git config user.email "epinez@noreply.codeberg.org"
          git commit -m "chore(l10n): update Android locale configuration"
          git push
