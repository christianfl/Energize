name: Setup Android
description: Install the Android SDK and Java development environment

runs:
  using: composite
  steps:
    - name: Update package lists
      shell: bash
      run: |
        set -euo pipefail

        add-apt-repository ppa:fdroid/fdroidserver
        apt-get update

    - name: Install Java
      shell: bash
      run: |
        set -euo pipefail

        apt-get install -y openjdk-21-jdk-headless
        update-alternatives --set java /usr/lib/jvm/java-21-openjdk-amd64/bin/java

    - name: Install Android SDK
      shell: bash
      env:
        ANDROID_HOME: '/usr/lib/android-sdk'
      run: |
        set -euo pipefail

        apt-get install -y android-sdk sdkmanager
        sdkmanager "cmdline-tools;latest"

        # Required because flutter_secure_storage currently compiles against API 37.
        android_sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        echo y | "$android_sdkmanager" --licenses
        "$android_sdkmanager" "platforms;android-37"
